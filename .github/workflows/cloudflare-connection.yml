name: Verify Cloudflare connection

on:
  push:
    branches:
      - arena/b6ad75ac-sirocash
    paths:
      - .github/workflows/cloudflare-connection.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify stored Cloudflare token (no provisioning)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate token without exposing its value
        env:
          CLOUDFLARE_ACCOUNT_ID: 54cf1f9f742ce2f8b674b2c3fa2cee51
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          async function main() {
            const token = process.env.CLOUDFLARE_API_TOKEN;
            if (!token || token !== token.trim()) {
              throw new Error('CLOUDFLARE_API_TOKEN is missing or contains surrounding whitespace. Check the repository Actions secret.');
            }
            const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
            if (!/^[a-f0-9]{32}$/.test(accountId || '')) throw new Error('Invalid Cloudflare account ID.');
            let response;
            try {
              response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/tokens/verify`, {
                headers: { Authorization: `Bearer ${token}` },
                redirect: 'error',
                signal: AbortSignal.timeout(20000)
              });
            } catch {
              throw new Error('Cloudflare verification endpoint could not be reached. No credentials were logged.');
            }
            let body;
            try { body = await response.json(); } catch {
              throw new Error('Cloudflare returned an unexpected verification response.');
            }
            if (!response.ok || body.success !== true || body.result?.status !== 'active') {
              const codes = (Array.isArray(body.errors) ? body.errors : []).map(item => item.code).filter(Number.isInteger).join(',');
              throw new Error(`Cloudflare did not confirm an active token (HTTP ${response.status}; error codes: ${codes || 'none'}). Check expiry, revocation and source-IP restrictions.`);
            }
            console.log('Cloudflare token is present and active. Its value was not displayed.');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '## Cloudflare connection check\n\n' +
              '- Repository secret is present.\n' +
              '- Cloudflare confirmed the account-owned token is active.\n' +
              '- No R2 bucket, D1 database or Worker was created or changed.\n' +
              '- Resource-specific permissions and application integration remain to be verified.\n');
          }
          main().catch(error => { console.error(`::error::${error.message}`); process.exitCode = 1; });
          NODE
