name: Provision private D1-only identity storage
on:
  push:
    branches: [arena/b6ad75ac-sirocash]
    paths:
      - .github/workflows/cloudflare-identity.yml
      - scripts/provision-cloudflare-identity.mjs
      - cloudflare/identity/**
      - .github/identity-bootstrap-public.pem
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sirocash-identity-provision
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provision only identity D1 and its private gateway
        env:
          CLOUDFLARE_ACCOUNT_ID: 54cf1f9f742ce2f8b674b2c3fa2cee51
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/provision-cloudflare-identity.mjs
      - name: Verify configured application lifecycle (bootstrap only)
        if: env.IDENTITY_BOOTSTRAP_CREATED == 'true'
        run: |
          node <<'NODE'
          async function main(){
            for(let attempt=0;attempt<75;attempt++){
              try {
                const response=await fetch('https://sirocash.vercel.app/api/internal/identity-lifecycle',{
                  headers:{Authorization:'Bearer '+process.env.IDENTITY_BOOTSTRAP_CRON_SECRET},
                  signal:AbortSignal.timeout(20000),redirect:'error'
                });
                if(response.status===200){console.log('::notice::Deployed application lifecycle authenticated and completed successfully; collection remains separately controlled.');return}
              }catch{}
              await new Promise(resolve=>setTimeout(resolve,8000));
            }
            throw Error('Application server integration was not confirmed in time. Do not enable identity collection.');
          }
          main().catch(error=>{console.error('::error::'+error.message);process.exitCode=1});
          NODE
