name: Provision private SiroCash identity storage
on:
  push:
    branches: [arena/b6ad75ac-sirocash]
    paths:
      - .github/workflows/cloudflare-identity.yml
      - scripts/provision-cloudflare-identity.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sirocash-identity-provision
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create only project identity resources and enforce private R2
        env:
          CLOUDFLARE_ACCOUNT_ID: 54cf1f9f742ce2f8b674b2c3fa2cee51
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/provision-cloudflare-identity.mjs
