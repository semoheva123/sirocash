name: Shared exchange-rate observations
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exchange-collector.yml'
      - 'api/exchange_collect.py'
  schedule:
    # Asia/Damascus is UTC+3: opening / midpoint / closing. Best effort, not exact-time SLA.
    - cron: '0 7,11,15 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'One initial snapshot only (server denies after first claimed slot)'
        type: boolean
        default: false
permissions:
  id-token: write
concurrency:
  group: exchange-rate-collector
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # No checkout, source key, DB credentials or third-party forwarding service.
      - name: Authenticate with short-lived GitHub OIDC and trigger one shared observation
        env:
          BOOTSTRAP: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.bootstrap || false }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.parse, urllib.error, sys, time
          try:
              audience = 'sirocash-exchange-collector'
              uri = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=' + urllib.parse.quote(audience)
              req = urllib.request.Request(uri, headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
              with urllib.request.urlopen(req, timeout=15) as r:
                  token = json.load(r)['value']
              # A deployment bootstrap waits on auth-only health, never on the provider.
              # This is necessary because repository integration cannot manually dispatch.
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, *args, **kwargs): return None
              opener = urllib.request.build_opener(NoRedirect)
              if os.environ.get('BOOTSTRAP','false').lower() == 'true':
                  last_health = 'UNKNOWN'
                  for attempt in range(24):
                      health = urllib.request.Request('https://www.sirocash.online/api/exchange_collect', headers={'Authorization':'Bearer '+token})
                      try:
                          with opener.open(health, timeout=12) as r:
                              if r.status == 204: break
                      except urllib.error.HTTPError as e:
                          last_health = 'HTTP_' + str(e.code)
                          try:
                              auth = json.loads(e.read(1024)).get('auth')
                              if auth in ('AUTH_HEADER','AUTH_DEPENDENCIES','AUTH_JWKS','AUTH_TOKEN','AUTH_REPOSITORY','AUTH_REF','AUTH_WORKFLOW','AUTH_SUBJECT','AUTH_EVENT'):
                                  last_health += ':' + auth
                          except Exception:
                              pass
                      except (urllib.error.URLError, TimeoutError):
                          last_health = 'TRANSPORT'
                      if attempt == 23:
                          print('::error title=Collector auth readiness::' + last_health)
                          raise RuntimeError('DEPLOYMENT_NOT_READY')
                      time.sleep(10)
              body = json.dumps({'bootstrap': os.environ.get('BOOTSTRAP','false').lower() == 'true'}).encode()
              req = urllib.request.Request('https://www.sirocash.online/api/exchange_collect', data=body,
                  headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'}, method='POST')
              # Reject redirects: never forward the short-lived token to another URL.
              with opener.open(req, timeout=80) as r:
                  result = json.loads(r.read(2048))
              state = result.get('state')
              reason = result.get('reason')
              allowed = {'OK','OUTSIDE_SLOT','CLAIM_DENIED','SCHEMA','SOURCE_TIME_REGRESSION','NETWORK_OR_TIMEOUT','HTTP','QUOTA','AUTH_OR_CHALLENGE','INVALID_RESPONSE','BODY_LIMIT'}
              summary = {'state': state if state in ('COLLECTED','SKIPPED','FAILED') else 'UNKNOWN',
                         'reason': reason if reason in allowed else 'UNKNOWN'}
              print('::notice title=Exchange collection::' + json.dumps(summary))
              if summary['state'] not in ('COLLECTED','SKIPPED'): sys.exit(1)
          except urllib.error.HTTPError as e:
              phase = 'UNKNOWN'
              try:
                  body = json.loads(e.read(1024))
                  if body.get('phase') in ('INITIALIZATION','DEPENDENCIES','DATABASE_CONNECT','COLLECTION'):
                      phase = body['phase']
              except Exception:
                  pass
              print('::error title=Exchange collection::HTTP_' + str(e.code) + ':' + phase + '; no source retry.')
              sys.exit(1)
          except Exception:
              print('::error title=Exchange collection::UNCONFIRMED; no retry; inspect sanitized collector state.')
              sys.exit(1)
