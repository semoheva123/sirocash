name: Check collector routing without credentials
on:
  pull_request:
    paths: ['.github/workflows/exchange-route-check.yml']
permissions:
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - shell: python
        run: |
          import urllib.request, urllib.error, json, os, base64
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          uri=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&audience=sirocash-exchange-collector'
          req=urllib.request.Request(uri,headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req,timeout=15) as r: token=json.load(r)['value']
          encoded=token.split('.')[1]
          claims=json.loads(base64.urlsafe_b64decode(encoded+'='*(-len(encoded)%4)))
          fields=('iss','aud','sub','repository','ref','workflow_ref','job_workflow_ref','workflow','nbf','exp','iat')
          print('::notice title=OIDC claim availability::'+json.dumps({k:k in claims for k in fields}))
          opener=urllib.request.build_opener(NoRedirect)
          for path in ('https://sirocash.vercel.app/', 'https://sirocash.vercel.app/api/exchange_collect', 'https://www.sirocash.online/', 'https://www.sirocash.online/api/exchange_collect'):
              status=0; fmt="none"; empty=False
              try:
                  with opener.open(path,timeout=15) as r:
                      status=r.status; fmt='json' if 'json' in r.headers.get('content-type','') else 'html'; empty=not bool(r.read(1))
              except urllib.error.HTTPError as e:
                  status=e.code; fmt='json' if 'json' in e.headers.get('content-type','') else 'html'; empty=not bool(e.read(1))
              except Exception: pass
              print('::notice title=Collector routing::'+path+' HTTP_'+str(status)+' '+fmt+' empty='+str(empty))
