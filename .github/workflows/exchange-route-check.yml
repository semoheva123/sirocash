name: Check collector routing without credentials
on:
  pull_request:
    paths: ['.github/workflows/exchange-route-check.yml']
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - shell: python
        run: |
          import urllib.request, urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect)
          for path in ('/api/exchange_collect','/api/exchange_collect.py','/api/exchange-rates'):
              status=0
              try:
                  with opener.open('https://sirocash.vercel.app'+path,timeout=15) as r: status=r.status
              except urllib.error.HTTPError as e: status=e.code
              except Exception: pass
              print('::notice title=Collector routing::'+path+' HTTP_'+str(status))
