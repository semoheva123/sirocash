name: Inspect public exchange webpage
on:
  pull_request:
    paths: ['scripts/inspect-exchange-web.mjs', '.github/workflows/exchange-web-inspection.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: node scripts/inspect-exchange-web.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-exchange-html
          path: .cache/exchange-web-inspection/
          retention-days: 1
