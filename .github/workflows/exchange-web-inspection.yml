name: Inspect public exchange webpage
# One bounded public-page check for the explicitly authorized source-only repair.
# No API key, paid API call, retry, proxy or challenge solver.
on:
  workflow_dispatch:
  push:
    branches: ['arena/d2df4f44-sirocash']
    paths: ['.github/workflows/exchange-web-inspection.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: exchange-public-inspection-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify inspection bounds without network
        run: python tests/exchange-tls-inspection.py
      - name: Install hash-locked diagnostic client
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r scripts/exchange-inspection-requirements.txt
      - name: One public-page TLS-profile request (no API key)
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/inspect-exchange-tls.py
      - name: Reuse the single successful public response (no source request)
        if: github.event_name == 'push'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-exchange-tls-inspection
          run-id: '41854494181'
          github-token: ${{ github.token }}
          path: .cache/exchange-tls-inspection
      - name: Inspect public units and field boundaries offline
        if: github.event_name == 'push'
        run: python scripts/inspect-public-exchange-fields.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-exchange-tls-inspection
          path: .cache/exchange-tls-inspection/
          retention-days: 1
