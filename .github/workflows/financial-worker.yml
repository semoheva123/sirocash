name: Financial worker
# Manual dispatch only. Scheduled deposit monitoring runs from Supabase pg_cron
# (sirocash-deposit-monitor, every two minutes) via /api/internal/deposit-monitor-scheduled;
# the former five-minute schedule here duplicated the same deposit-only scan and contended
# for the same scanner lease. Re-add a scheduler deliberately before enabling full execution.
on:
  workflow_dispatch:
    inputs:
      max_batches:
        description: 'Maximum sequential watch-only catch-up batches; stops on any error'
        type: choice
        options: ['1', '8', '32']
        default: '32'
permissions: {}
concurrency:
  group: financial-worker
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      # Manual dispatch first verifies authentication, then runs the isolated deposit monitor.
      # No external execution is composed by the deposit-monitor endpoint.
      - name: Verify worker credential without executing financial work
        if: github.event_name == 'workflow_dispatch'
        env:
          WORKER_SECRET: ${{ secrets.SIRO_FINANCIAL_WORKER_SECRET }}
        run: |
          set -eu
          test "${#WORKER_SECRET}" -ge 32 && test "${#WORKER_SECRET}" -le 512 || { echo 'Worker credential missing or invalid length.'; exit 1; }
          status=$(curl --silent --show-error --max-time 20 --retry 0 \
            --proto '=https' --request GET --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${WORKER_SECRET}" \
            'https://sirocash.vercel.app/api/internal/financial-worker') || { echo 'AUTH_CHECK_TRANSPORT_FAILED: no worker execution requested.'; exit 1; }
          case "$status" in
            204) echo 'AUTH_CHECK_PASS: GitHub credential accepted by production; no database access or financial work.' ;;
            401) echo 'AUTH_CHECK_REJECTED: credential missing, invalid or different from deployed production.'; exit 1 ;;
            *) echo "AUTH_CHECK_UNEXPECTED_HTTP_${status}: not accepted; no worker execution requested."; exit 1 ;;
          esac
      - name: Run isolated deposit monitor
        if: github.event_name == 'workflow_dispatch'
        env:
          MONITOR_MAX_BATCHES: ${{ inputs.max_batches || '1' }}
          WORKER_SECRET: ${{ secrets.SIRO_FINANCIAL_WORKER_SECRET }}
        run: |
          set -eu
          trap 'rm -f deposit-monitor-result.json' EXIT
          limit=${MONITOR_MAX_BATCHES:-1}
          case "$limit" in 1|8|32) ;; *) echo 'INVALID_BATCH_LIMIT'; exit 1 ;; esac
          for batch in $(seq 1 "$limit"); do
          echo "DEPOSIT_MONITOR_BATCH_${batch}"
          status=$(curl --silent --show-error --max-time 175 --retry 0 \
            --proto '=https' --request POST --output deposit-monitor-result.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${WORKER_SECRET}" --header 'Content-Length: 0' \
            'https://sirocash.vercel.app/api/internal/deposit-monitor') || { echo 'DEPOSIT_MONITOR_TRANSPORT_FAILED: inspect scanner health before another run.'; exit 1; }
          test "$status" = 200 || { echo "DEPOSIT_MONITOR_HTTP_${status}: monitor did not confirm completion."; exit 1; }
          if python3 - <<'PYTHON'
          import json, sys
          try:
              with open('deposit-monitor-result.json') as f:
                  result = json.load(f)
              valid = isinstance(result, dict) and result.get('state') == 'COMPLETED' and result.get('healthy') is True
              valid = valid and all(type(result.get(k)) is int and result[k] >= 0 for k in ['scans', 'staged', 'held', 'valuations'])
              if isinstance(result, dict):
                  summary = {'state': result.get('state') if result.get('state') == 'COMPLETED' else 'UNKNOWN',
                             'healthy': result.get('healthy') if type(result.get('healthy')) is bool else None}
                  for key in ['scans', 'staged', 'held', 'valuations']:
                      value = result.get(key)
                      summary[key] = value if type(value) is int and 0 <= value <= 1000000000 else None
                  print('DEPOSIT_MONITOR_SUMMARY:' + json.dumps(summary, sort_keys=True), flush=True)
                  checks = result.get('checks', {})
                  if isinstance(checks, dict):
                      for network in ['BEP20', 'TRC20']:
                          check = checks.get(network)
                          state = check.get('state') if isinstance(check, dict) else None
                          allowed = ['PROGRESSED', 'WAITING_FINALITY', 'BUSY_OR_PAUSED', 'FAILED']
                          print(network + '_STATE: ' + (state if state in allowed else 'UNKNOWN'), flush=True)
                          if isinstance(check, dict):
                              metrics = {}
                              for key in ['blocks', 'elapsedMs', 'lagBlocks']:
                                  value = check.get(key)
                                  if type(value) is int and 0 <= value <= 1000000000:
                                      metrics[key] = value
                              print(network + '_PROGRESS: ' + json.dumps(metrics, sort_keys=True), flush=True)
              if not valid or result['held'] != 0:
                  checks = result.get('checks', {})
                  if isinstance(checks, dict):
                      safe = {'RPC_HTTP_FAILURE', 'RPC_RATE_LIMITED', 'RPC_CONTENT_TYPE_INVALID', 'RPC_RESPONSE_TOO_LARGE', 'RPC_EMPTY_RESPONSE', 'RPC_TIMEOUT', 'RPC_INVALID_JSON', 'RPC_INVALID_ENVELOPE', 'RPC_TRANSPORT_FAILURE', 'RPC_LOG_WRONG_CHAIN', 'RPC_LOG_HEIGHT_INVALID', 'RPC_LOG_PROVIDER_LAG', 'RPC_LOG_CHAIN_MISMATCH', 'SCAN_WRONG_CHAIN', 'SCAN_INVALID_FINALITY', 'SCAN_INVALID_HEIGHT', 'SCAN_INVALID_HASH', 'SCAN_INVALID_OBJECT', 'CHAIN_HTTP_FAILED','CHAIN_HTTP_429','CHAIN_HTTP_401','CHAIN_HTTP_403','CHAIN_HTTP_5XX','CHAIN_HTTP_OTHER_STATUS','CHAIN_HTTP_CONTENT_TYPE','CHAIN_HTTP_BODY_LIMIT','CHAIN_HTTP_TIMEOUT_OR_ABORT','CHAIN_HTTP_INVALID_JSON','CHAIN_HTTP_TRANSPORT', 'SCAN_BLOCK_MISMATCH', 'SCAN_INCOMPLETE_RECEIPTS', 'SCAN_RECEIPT_CONTEXT', 'SCAN_LOG_CONTEXT', 'SCAN_BLOCK_LIMIT', 'SCAN_LOG_LIMIT', 'SCAN_BULK_RECEIPTS_UNAVAILABLE', 'SCAN_ADDRESS_CAPACITY', 'SCAN_ABORTED', 'SCAN_LEASE_LOST', 'SCAN_ASSIGNMENTS_CHANGED', 'CHAIN_REORG', 'DEPOSIT_EVIDENCE_CONFLICT', 'SCAN_FAILED'}
                      for network in ['BEP20', 'TRC20']:
                          check = checks.get(network)
                          if isinstance(check, dict) and check.get('state') == 'FAILED':
                              code = check.get('failureCode')
                              print(network + ': ' + (code if isinstance(code, str) and code in safe else 'SCAN_FAILED'), flush=True)
                  counts_valid = all(type(result.get(k)) is int and result[k] >= 0 for k in ['scans', 'staged', 'held', 'valuations'])
                  states = [checks.get(n, {}).get('state') if isinstance(checks.get(n), dict) else None for n in ['BEP20', 'TRC20']] if isinstance(checks, dict) else []
                  if result.get('state') == 'COMPLETED' and result.get('healthy') is False and counts_valid and result['held'] == 0 and len(states) == 2 and all(s in ['PROGRESSED', 'WAITING_FINALITY'] for s in states) and 'PROGRESSED' in states:
                      print('DEPOSIT_MONITOR_CATCHING_UP: verified progress; reception remains gated.', flush=True)
                      sys.exit(75)
                  raise ValueError()
          except Exception:
              sys.exit('DEPOSIT_MONITOR_NOT_HEALTHY: no customer reception readiness established.')
          print('DEPOSIT_MONITOR_PASS: scanners healthy; no signing, purchases or broadcasts.')
          PYTHON
          then exit 0
          else code=$?
          fi
          test "$code" = 75 || exit "$code"
          done
          echo 'DEPOSIT_MONITOR_CATCHUP_LIMIT: not healthy yet; inspect real lag before continuing.'
          exit 1
