name: Security and offline financial checks
on:
  push:
    branches: [arena/b6ad75ac-sirocash]
  pull_request:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SIRO_SIGNER_ENABLED: 'false'
      SIRO_CUSTODY_PREFLIGHT: 'false'
      SIRO_RPC_READ_ENABLED: 'false'
      SIRO_DURABLE_PASSKEY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified official ref
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run build
