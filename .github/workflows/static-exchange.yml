name: Isolated static exchange prices
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/static-exchange.yml'
      - 'scripts/publish-static-exchange.py'
      - 'exchange_worker/public_page.py'
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-static-exchange
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    steps:
      - name: Require independently configured Pages before any source request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/pages --jq '.build_type' | grep -x workflow
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: One credential-free source read
        id: collect
        env:
          PYTHONPATH: .
        run: python scripts/publish-static-exchange.py
      - name: Stop scheduled requests after a source failure (no automated re-arm)
        if: ${{ always() && steps.collect.outcome != 'skipped' && steps.collect.outcome != '' && steps.collect.outputs.publish != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT repos/${{ github.repository }}/actions/workflows/static-exchange.yml/disable
          echo 'Source failed; previous static deployment retained. Schedule disabled for operator review.'
          exit 1
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        if: steps.collect.outputs.publish == 'true'
        with:
          path: static-exchange
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        if: steps.collect.outputs.publish == 'true'
        id: deployment
