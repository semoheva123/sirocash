name: TRON index read-only probe
on:
  pull_request:
    paths:
      - '.github/workflows/tron-index-probe.yml'
  workflow_dispatch:
    inputs:
      address:
        description: 'Public base58 TRON address to inspect (indexed TRC20 history only)'
        required: true
        default: 'TNPeeaaFB7K9cmo4uQpcU32zGK8G1NYqeL'
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Public, keyless, read-only shape check of the TronGrid indexed TRC20 history API.
      # No secrets, database, signing, broadcast or production endpoint is touched.
      - name: Query indexed TRC20 history with timestamp bounds
        env:
          ADDRESS: ${{ inputs.address || 'TNPeeaaFB7K9cmo4uQpcU32zGK8G1NYqeL' }}
        run: |
          set -eu
          case "$ADDRESS" in T[1-9A-HJ-NP-Za-km-z]*) test "${#ADDRESS}" = 34 ;; *) echo 'INVALID_ADDRESS'; exit 1 ;; esac
          now=$(date +%s000); min=$((now-3600000))
          usdt=TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
          url="https://api.trongrid.io/v1/accounts/${ADDRESS}/transactions/trc20?only_to=true&only_confirmed=true&contract_address=${usdt}&min_timestamp=${min}&max_timestamp=${now}&limit=3&order_by=block_timestamp%2Casc"
          code=$(curl --silent --show-error --max-time 20 --retry 0 --proto '=https' --output body.json --write-out '%{http_code}' --header 'Accept: application/json' "$url")
          echo "::notice title=HTTP_STATUS::$code"
          python3 - <<'PYTHON'
          import json,os
          with open('body.json') as f: r=json.load(f)
          meta=r.get('meta',{}) or {}
          data=r.get('data',[]) or []
          out=['SUCCESS='+str(r.get('success')),'META_KEYS='+','.join(sorted(meta.keys())),'PAGE_SIZE='+str(meta.get('page_size')),'FP='+str(bool(meta.get('fingerprint'))),'LINKS='+','.join(sorted((meta.get('links') or {}).keys())),'ITEMS='+str(len(data))]
          print('::notice title=WIDE::'+' '.join(out))
          for item in data[:2]:
              ti=item.get('token_info') or {}
              print('::notice title=ITEM::'+' '.join(['KEYS='+','.join(sorted(item.keys())),'TYPE='+str(item.get('type')),'TO_MATCHES='+str(item.get('to')==os.environ.get('ADDRESS')),'TOKEN='+str(ti.get('address')),'TS='+str(item.get('block_timestamp')),'VALUE_TYPE='+type(item.get('value')).__name__,'TXID_LEN='+str(len(str(item.get('transaction_id'))))]))
          PYTHON
          # Narrow bound sanity: a 1ms window ending before now must return nothing or only in-window items.
          probe_max=$((now-1800000)); probe_min=$((probe_max-1))
          url2="https://api.trongrid.io/v1/accounts/${ADDRESS}/transactions/trc20?only_to=true&only_confirmed=true&contract_address=${usdt}&min_timestamp=${probe_min}&max_timestamp=${probe_max}&limit=3"
          curl --silent --show-error --max-time 20 --retry 0 --proto '=https' --output narrow.json --header 'Accept: application/json' "$url2"
          export PROBE_MIN=$probe_min PROBE_MAX=$probe_max
          python3 - <<'PYTHON'
          import json,os
          r=json.load(open('narrow.json'))
          print('::notice title=NARROW::SUCCESS='+str(r.get('success'))+' ITEMS='+str(len(r.get('data',[])))+' TS='+str([i.get('block_timestamp') for i in r.get('data',[])])+' MIN='+os.environ.get('PROBE_MIN','')+' MAX='+os.environ.get('PROBE_MAX',''))
          PYTHON
          # Header-only block read availability on the solidity path (detail=false).
          code3=$(curl --silent --show-error --max-time 20 --retry 0 --proto '=https' --output header.json --write-out '%{http_code}' --header 'Content-Type: application/json' --data '{"detail":false}' 'https://api.trongrid.io/walletsolidity/getblock')
          export CODE3=$code3
          python3 - <<'PYTHON'
          import json,os
          try:
              r=json.load(open('header.json'))
              keys=','.join(sorted(r.keys())) if isinstance(r,dict) else type(r).__name__
              num=(r.get('block_header',{}).get('raw_data',{}).get('number') if isinstance(r,dict) else None)
              print('::notice title=GETBLOCK::STATUS='+os.environ['CODE3']+' KEYS='+keys+' HAS_TX='+str('transactions' in r if isinstance(r,dict) else None)+' NUMBER='+str(num)+' BYTES='+str(len(open('header.json','rb').read())))
          except Exception as e:
              print('::notice title=GETBLOCK::STATUS='+os.environ['CODE3']+' PARSE_FAILED='+type(e).__name__)
          PYTHON
